<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenWalls</title>
<style>html,body{margin:0;height:100%;background:#14112b;color:#f6efe4;font-family:system-ui,sans-serif}body{display:grid;place-items:center;text-align:center;padding:24px}
.s{width:48px;height:48px;border:4px solid #30123f;border-top-color:#F9A719;border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
h1{font-size:24px;margin:0 0 8px}p{opacity:.8;font-size:14px;margin:0}</style></head>
<body><main><div class="s" aria-hidden="true"></div><h1>You're offline</h1><p>This page will open by itself as soon as you're back online.</p></main>
<script>
function go(){location.reload()}
addEventListener('online',go);
setInterval(function(){fetch(location.href,{method:'HEAD',cache:'no-store'}).then(function(r){if(r.ok)go()}).catch(function(){})},3000);
</script></body></html>
